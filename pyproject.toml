[project]
name = "rcagent"
version = "0.1.0"
description = "Read-only MCP investigation agent with observable Planner and Worker workflows."
authors = [{name = "MalfuRisa"}]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "httpx>=0.28,<1",
    "jsonschema>=4,<5",
    "langchain-core>=0.3.72,<0.4",
    "langchain-mcp-adapters>=0.1.9,<0.2",
    "langchain-openai>=0.3.28,<0.4",
    "langgraph>=0.6.6,<0.7",
    "mcp>=1.17,<2",
    "pydantic>=2.7.4,<3",
    "python-dotenv>=1.1.1,<2",
]

[project.optional-dependencies]
studio = ["langgraph-cli[inmem]>=0.4.2,<0.5"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
